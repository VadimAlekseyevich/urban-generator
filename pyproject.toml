[project]
name = "urban-generator"
version = "0.1.0"
description = "Локальный сервис генерации городской застройки для ВКР"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
    "rasterio>=1.4",
    "scipy>=1.14",
    "streamlit>=1.67",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m examples.run_experiment --output-dir "$RUNNER_TEMP/urban-experiment"
      - run: uv run --frozen python -m examples.run_benchmark --output-dir "$RUNNER_TEMP/urban-benchmark"
      - name: Rehearse README with external network disabled
        run: |
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --init-groups env HOME="$4" URBAN_OFFLINE_CHECK=1 "$3" -m pytest -q -s tests/test_offline_demo.py
          ' _ "$(id -u)" "$(id -g)" "$PWD/.venv/bin/python" "$HOME"
      - name: OSM PBF integration
        run: uv run --frozen --with osmium==4.3.2 pytest -q tests/test_osm_import.py

name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build with Windows launcher
        shell: cmd
        env:
          URBAN_SKIP_PULL: "1"
          URBAN_NO_PAUSE: "1"
        run: build_and_run.bat build
      - name: Check resource decoding with UTF-8 mode disabled
        env:
          PYTHONUTF8: "0"
        run: uv run --frozen python -m pytest -q tests/test_viewer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-launcher-logs
          path: .urban-runs/
          include-hidden-files: true
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen --with playwright==1.56.0 python -m playwright install --with-deps chromium
      - run: uv run --frozen --with playwright==1.56.0 pytest -q tests/test_browser_map.py
        env:
          URBAN_BROWSER_CHECK: "1"
          URBAN_BROWSER_ARTIFACTS: ${{ runner.temp }}/urban-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-browser
          path: ${{ runner.temp }}/urban-browser
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Install independent GIS reader
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m examples.run_experiment --output-dir "$RUNNER_TEMP/urban-experiment"
      - run: uv run --frozen python -m examples.run_benchmark --output-dir "$RUNNER_TEMP/urban-benchmark"
      - name: Rehearse README with external network disabled
        run: |
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --init-groups env HOME="$4" URBAN_OFFLINE_CHECK=1 "$3" -m pytest -q -s tests/test_offline_demo.py
          ' _ "$(id -u)" "$(id -g)" "$PWD/.venv/bin/python" "$HOME"
      - name: OSM PBF integration
        run: uv run --frozen --with osmium==4.3.2 pytest -q tests/test_osm_import.py tests/test_osm_cache.py tests/test_osm_app.py
